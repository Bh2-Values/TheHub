<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BH2 Value List & Trade Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1015; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { color: #a78bfa; text-align: center; margin-bottom: 25px; }
    
    .controls { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
    input, select { padding: 12px; border-radius: 8px; border: 1px solid #2d3748; background: #1a202c; color: #fff; flex: 1; min-width: 200px; font-size: 1rem; }
    
    .table-responsive { overflow-x: auto; background: #1a202c; border-radius: 10px; border: 1px solid #2d3748; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid #2d3748; }
    th { background: #2d3748; color: #a78bfa; font-weight: 600; }
    tr:hover { background: #242c3d; }
    
    .btn-trade { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; margin-right: 4px; transition: 0.2s; }
    .btn-your { background: #8b5cf6; color: white; }
    .btn-your:hover { background: #7c3aed; }
    .btn-their { background: #ec4899; color: white; }
    .btn-their:hover { background: #db2777; }
    
    .trade-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .trade-card { background: #1a202c; border: 1px solid #2d3748; border-radius: 10px; padding: 20px; }
    .trade-card h3 { margin-top: 0; color: #a78bfa; border-bottom: 1px solid #2d3748; padding-bottom: 10px; }
    .trade-list { list-style: none; padding: 0; margin: 0; min-height: 120px; }
    .trade-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2d3748; }
    .remove-btn { color: #f87171; cursor: pointer; font-weight: bold; margin-left: 10px; }
    .trade-total { font-size: 1.2rem; margin-top: 15px; font-weight: bold; text-align: right; }
  </style>
</head>
<body>

  <div class="container">
    <h1>BH2 Value List & Trade Calculator</h1>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search item..." onkeyup="filterData()">
      <select id="statusFilter" onchange="filterData()">
        <option value="">All Statuses</option>
        <option value="🟢">📈 Rising</option>
        <option value="⚪">⚖️ Stable</option>
        <option value="🟣">≈ Fluctuating</option>
        <option value="🔴">📉 Decreasing</option>
        <option value="⚠️">⚠️ Manipulated</option>
      </select>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Value / Price</th>
            <th>Status</th>
            <th>Add to Trade</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Trade Calculator -->
    <h2>Trade Calculator</h2>
    <div class="trade-section">
      <div class="trade-card">
        <h3>Your Offer</h3>
        <ul id="yourList" class="trade-list"></ul>
        <div class="trade-total">Total: <span id="yourTotal" style="color: #8b5cf6;">0m</span></div>
      </div>
      
      <div class="trade-card">
        <h3>Their Offer</h3>
        <ul id="theirList" class="trade-list"></ul>
        <div class="trade-total">Total: <span id="theirTotal" style="color: #ec4899;">0m</span></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
