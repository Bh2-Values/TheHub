<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BH2 | Official Value List & Trade Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151a23;
      --card-border: #232a36;
      
      /* Green theme for You */
      --green-primary: #22c55e;
      --green-hover: #16a34a;
      --green-bg: rgba(34, 197, 94, 0.08);
      --green-border: rgba(34, 197, 94, 0.25);
      
      /* Red theme for Them */
      --red-primary: #ef4444;
      --red-hover: #dc2626;
      --red-bg: rgba(239, 68, 68, 0.08);
      --red-border: rgba(239, 68, 68, 0.25);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; padding: 20px 15px; }

    .container { max-width: 1140px; margin: 0 auto; }

    /* Header */
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(to right, #4ade80, #f87171); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

    /* Search & Filters */
    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .search-input, .select-filter { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: all 0.2s; }
    .search-input { flex: 2; min-width: 240px; }
    .select-filter { flex: 1; min-width: 180px; cursor: pointer; }
    .search-input:focus, .select-filter:focus { border-color: var(--green-primary); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }

    /* Main Grid Layout */
    .dashboard-grid { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 24px; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

    /* Item Grid Container */
    .items-container { max-height: 680px; overflow-y: auto; padding-right: 5px; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

    /* Tarjeta individual de ítem */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .item-card:hover { transform: translateY(-2px); border-color: #3b82f6; }

    .item-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .item-card .item-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.2;
      word-break: break-word;
    }

    .item-card .item-price {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 6px;
    }

    .item-card .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }

    /* Action Buttons */
    .btn-group { display: flex; gap: 4px; width: 100%; }
    .btn-add { flex: 1; border: none; padding: 6px 0; border-radius: 6px; font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .btn-your { background: var(--green-primary); color: #000; }
    .btn-your:hover { background: var(--green-hover); color: #fff; }
    .btn-their { background: var(--red-primary); color: #fff; }
    .btn-their:hover { background: var(--red-hover); }

    /* Trade Calculator Side Panel */
    .calculator-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px; height: fit-content; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .calculator-card h2 { font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; color: #fff; }

    .trade-sides { display: flex; flex-direction: column; gap: 16px; }
    
    /* Green Side Box (Your Offer) */
    .side-box-your { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 8px; padding: 14px; }
    .your-title { color: #4ade80; }

    /* Red Side Box (Their Offer) */
    .side-box-their { background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 8px; padding: 14px; }
    .their-title { color: #f87171; }

    .side-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .side-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

    .trade-list { list-style: none; min-height: 80px; max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .trade-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 6px; font-size: 0.88rem; }
    .remove-icon { color: #ef4444; cursor: pointer; font-weight: bold; margin-left: 8px; font-size: 0.9rem; }
    .remove-icon:hover { color: #f87171; }

    .side-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--card-border); font-size: 0.9rem; font-weight: 600; }
    
    /* Result Verdict */
    .verdict-box { text-align: center; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .verdict-win { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .verdict-fair { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .verdict-loss { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BH2 Value List & Trade Calculator</h1>
      <p>Live Item Values & Fair Trade Calculator for BH2 Community</p>
    </header>

    <div class="filter-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar mineral/ítem..." onkeyup="filterData()">
      <select id="statusFilter" class="select-filter" onchange="filterData()">
        <option value="">Todos los Estados</option>
        <option value="🟢">📈 En subida</option>
        <option value="⚪">⚖️ Estable</option>
        <option value="🟣">≈ Fluctuando</option>
        <option value="🔴">📉 En bajada</option>
        <option value="⚠️">⚠️ Manipulado</option>
      </select>
    </div>

    <div class="dashboard-grid">
      <!-- Item Grid (Reemplaza a la tabla antigua) -->
      <div class="items-container">
        <div id="itemsGrid" class="items-grid"></div>
      </div>

      <!-- Trade Calculator Side Panel -->
      <div class="calculator-card">
        <h2>Trade Calculator</h2>
        
        <div class="trade-sides">
          <!-- Your Side (Green Accent) -->
          <div class="side-box-your">
            <div class="side-header">
              <span class="side-title your-title">Your Offer</span>
            </div>
            <ul id="yourList" class="trade-list"></ul>
            <div class="side-footer">
              <span>Your Total:</span>
              <span id="yourTotal" style="color: #4ade80;">0m</span>
            </div>
          </div>

          <!-- Their Side (Red Accent) -->
          <div class="side-box-their">
            <div class="side-header">
              <span class="side-title their-title">Their Offer</span>
            </div>
            <ul id="theirList" class="trade-list"></ul>
            <div class="side-footer">
              <span>Their Total:</span>
              <span id="theirTotal" style="color: #f87171;">0m</span>
            </div>
          </div>
        </div>

        <div id="verdictBox" class="verdict-box verdict-fair">
          Equal Trade
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
