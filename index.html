<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BH2 Value List & Trade Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121214; color: #fff; margin: 20px; }
    h1 { color: #8a5cf6; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
    table { width: 100%; border-collapse: collapse; background: #1e1e24; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2d2d35; }
    th { background: #2b2b36; color: #a78bfa; }
    tr:hover { background: #282832; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85em; }
    .trade-container { display: flex; gap: 20px; margin-top: 30px; }
    .trade-box { flex: 1; background: #1e1e24; padding: 15px; border-radius: 8px; }
  </style>
</head>
<body>

  <h1>BH2 Values & Trade Calculator</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Buscar objeto..." onkeyup="filterData()">
    <select id="statusFilter" onchange="filterData()">
      <option value="">Todos los estados</option>
      <option value="🟢">📈 Rising</option>
      <option value="⚪">⚖️ Stable</option>
      <option value="🟣">≈ Fluctuating</option>
      <option value="🔴">📉 Decreasing</option>
    </select>
  </div>

  <table id="valueTable">
    <thead>
      <tr>
        <th>Ítem</th>
        <th>Precio</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="trade-container">
    <div class="trade-box">
      <h3>Tu Oferta</h3>
      <ul id="yourSide"></ul>
      <p>Total: <strong id="yourTotal">0m</strong></p>
    </div>
    <div class="trade-box">
      <h3>Su Oferta</h3>
      <ul id="theirSide"></ul>
      <p>Total: <strong id="theirTotal">0m</strong></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
